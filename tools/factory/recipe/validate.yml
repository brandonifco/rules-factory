name: validate

# Emitted by rules-factory tools/factory (the gate recipe, #3). Rewritten by every
# `factory produce`.
#
# This engine has exactly one definition of "acceptable": ./scripts/validate.sh full. This
# workflow runs it and does nothing else; reimplementing the recipe here would create a second
# definition that drifts from the first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    # A fixed release, not ubuntu-latest: that alias moves, and the toolchain under it with it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The accidental-publication guardrail (docs/decisions/0068). An engine produced from a
      # corpus whose manifest declares `distribution: private` records that in provenance.json,
      # and this repository must not be public. GitHub already knows whether it is, so the check
      # costs nothing here -- and it lives here alone: ./scripts/validate.sh must pass with no
      # network and no GitHub, so verification never depends on either.
      #
      # This is not a security mechanism. It cannot unpublish anything; it fails the build so a
      # person finds out.
      - name: Refuse a private engine in a public repository
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          distribution="$(python3 -c 'import json;print(json.load(open("provenance.json")).get("distribution","public"))')"
          echo "provenance distribution: $distribution; repository private: ${REPOSITORY_IS_PRIVATE:-unknown}"
          if [[ "$distribution" != "private" ]]; then
            exit 0
          fi
          if [[ "$REPOSITORY_IS_PRIVATE" == "false" ]]; then
            echo "::error::provenance.json records distribution private, and GitHub reports this repository as public. This engine is produced from licensed material that may not be publicly distributed (docs/decisions/0068). Make the repository private, or re-produce it from a corpus whose licence permits publishing."
            exit 1
          fi
          echo "a private engine in a repository GitHub does not report as public"

      - name: Read the pinned SDK version
        id: sdk
        run: echo "version=$(python3 -c 'import json;print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Validate
        env:
          CI: "true"
        run: ./scripts/validate.sh full

name: conformance-gate

# Emitted by rules-factory as a managed file (decision 0029). It runs tools/conformance-gate.py,
# which asks whether the review verdicts this change needs are recorded at the commit being
# merged. The verdicts themselves are commit statuses, written by tools/record-verdict.py; this
# workflow records nothing and reviews nothing.
#
# It re-runs on `synchronize` because that is the point: a new commit means the verdicts recorded
# on the old one no longer describe what is being merged, and this check goes red again by itself.
# And on `edited`, because what a change owes is its review class's to say (rules-factory 0076) and
# the class a pull request claims is a line in its body: take the line out, or raise it, and the
# commit is unchanged while what the gate asks of it is not.
#
# It deliberately does NOT trigger on `status`, though recording a verdict is exactly when this
# check must be asked again. A `status` run belongs to the default branch's commit, not to the
# pull request whose head the verdict names, so this job would report the required check's name
# onto a commit that is nobody's head -- and `github.event.pull_request.number` is empty there, so
# it would have no pull request to ask about either. Recording a verdict re-runs this workflow
# from outside instead: .github/workflows/verdict-requeue.yml re-requests the pull request run at
# that head. So this check has exactly one producer, the `pull_request` event, and one commit it
# ever lands on (rules-factory #191).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: [main]

concurrency:
  group: conformance-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: read

jobs:
  conformance-gate:
    # The runner is a repository variable's JSON label or list of labels (decisions 0079, 0080).
    # FACTORY_RUNS_ON_TRUSTED takes only a run the owner started on a commit of this repository,
    # and a dispatcher outside this file checks that again before any runner exists for it; any
    # other run is hosted. FACTORY_RUNS_ON takes every run and is for private repositories alone,
    # or is exactly "ubuntu-24.04" on the owner's decision. There is no default (decision 0087):
    # neither set, both, or a value naming neither factory-ci nor exactly "ubuntu-24.04", and the
    # job fails at once on a runner group that does not exist. An offline runner is waited for,
    # never replaced by a hosted one.
    runs-on: ${{ fromJSON(vars.FACTORY_RUNS_ON_TRUSTED && vars.FACTORY_RUNS_ON && '{"group":"FACTORY_RUNS_ON or FACTORY_RUNS_ON_TRUSTED is unset or invalid"}' || github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event.pull_request.head.repo.full_name || !github.event.pull_request && github.repository) == github.repository && (contains(vars.FACTORY_RUNS_ON_TRUSTED || vars.FACTORY_RUNS_ON, '"factory-ci"') && (vars.FACTORY_RUNS_ON_TRUSTED || vars.FACTORY_RUNS_ON) || vars.FACTORY_RUNS_ON == '"ubuntu-24.04"' && '"ubuntu-24.04"' || '{"group":"FACTORY_RUNS_ON or FACTORY_RUNS_ON_TRUSTED is unset or invalid"}') || contains(vars.FACTORY_RUNS_ON, '"factory-ci"') && vars.FACTORY_RUNS_ON || vars.FACTORY_RUNS_ON == '"ubuntu-24.04"' && '"ubuntu-24.04"' || contains(vars.FACTORY_RUNS_ON_TRUSTED, '"factory-ci"') && '"ubuntu-24.04"' || '{"group":"FACTORY_RUNS_ON or FACTORY_RUNS_ON_TRUSTED is unset or invalid"}') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the recorded verdicts at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/conformance-gate.py "${{ github.event.pull_request.number }}"

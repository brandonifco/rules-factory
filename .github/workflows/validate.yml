name: validate

# This repository has one definition of "acceptable": ./scripts/validate.sh. This workflow
# calls it and does nothing else of substance. Reimplementing the steps here would create a
# second definition that drifts from the first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    # A fixed release, not the ubuntu-latest alias: that alias has jumped Ubuntu releases
    # before, and a corpus checker whose answers depend on the Python it met is worse than
    # no checker.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # validate.sh runs repo-controlled Python and shell from this checkout. None of it
          # needs to write to the remote, so a credential capable of doing so has no reason
          # to sit in .git/config while it runs.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --quiet --disable-pip-version-check pytest

      # Checks every map against the schema, every citation against its corpus, the
      # checkers' own 56 tests, every repository link, and the decision index.
      - name: Validate
        run: ./scripts/validate.sh

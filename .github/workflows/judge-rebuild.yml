name: judge-rebuild

# The final judgement of a blind rebuild of hoyle-backgammon (rules-factory#3, criterion 1), on the SDK
# the target pins (Brandon, 2026-09-15, H11). examples/hoyle-blind-rebuild/EQUIVALENCE.md defines the
# pass condition and RUNBOOK.md step 7 says when to run this. Run by hand only: it judges a repository
# and commit named at dispatch, not this repository's changes.
#
# It runs check-rebuild.py (P1 to P4) and then P5's `factory provenance` with the factory checked out at
# the tag. The rebuild's own CI `validate` run is read from its repository, not repeated here.

on:
  workflow_dispatch:
    inputs:
      rebuild_repository:
        description: "owner/name of the rebuilt engine's repository (public)"
        required: true
      rebuild_commit:
        description: "the full commit sha handed in"
        required: true

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      REBUILD_REPOSITORY: ${{ inputs.rebuild_repository }}
      REBUILD_COMMIT: ${{ inputs.rebuild_commit }}
    steps:
      - name: Checkout rules-factory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Refuse malformed inputs
        run: |
          [[ "$REBUILD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad repository"; exit 1; }
          [[ "$REBUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit must be a full sha"; exit 1; }

      - name: Clone the target and the rebuild
        run: |
          engine_commit="$(python3 -c 'import json;print(json.load(open("examples/hoyle-blind-rebuild/TARGET.json"))["engine"]["commit"])')"
          git clone --quiet https://github.com/brandonifco/hoyle-backgammon "$RUNNER_TEMP/target"
          git -C "$RUNNER_TEMP/target" cat-file -e "$engine_commit^{commit}"
          git clone --quiet "https://github.com/$REBUILD_REPOSITORY" "$RUNNER_TEMP/rebuild"
          git -C "$RUNNER_TEMP/rebuild" cat-file -e "$REBUILD_COMMIT^{commit}"
          sdk="$(git -C "$RUNNER_TEMP/target" show "$engine_commit:global.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["sdk"]["version"])')"
          echo "SDK=$sdk" >> "$GITHUB_ENV"

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK }}

      - name: P1 to P4 (check-rebuild.py)
        run: |
          set -o pipefail
          python3 examples/hoyle-blind-rebuild/check-rebuild.py "$RUNNER_TEMP/rebuild" "$RUNNER_TEMP/target" \
            --commit "$REBUILD_COMMIT" | tee "$RUNNER_TEMP/check-rebuild.out"

      - name: P5 (factory provenance, with the factory at the tag)
        if: always()
        run: |
          tag="$(python3 -c 'import json;print(json.load(open("examples/hoyle-blind-rebuild/TARGET.json"))["factory"]["tag"])')"
          git worktree add --quiet "$RUNNER_TEMP/factory" "$tag"
          git -C "$RUNNER_TEMP/rebuild" worktree add --quiet --detach "$RUNNER_TEMP/rebuild-at-commit" "$REBUILD_COMMIT"
          PYTHONDONTWRITEBYTECODE=1 python3 "$RUNNER_TEMP/factory/tools/factory" provenance --engine "$RUNNER_TEMP/rebuild-at-commit" \
            | tee "$RUNNER_TEMP/provenance.out"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Blind rebuild: $REBUILD_REPOSITORY@$REBUILD_COMMIT on SDK $SDK"
            echo '```'
            cat "$RUNNER_TEMP/check-rebuild.out" 2>/dev/null | grep -v '^       ' || true
            cat "$RUNNER_TEMP/provenance.out" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
